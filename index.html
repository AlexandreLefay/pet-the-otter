<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Pet the otter</title>
    <style>
      /* écran de chargement : affiché avant même que le JavaScript n'arrive (cf. src/boot.ts) */
      .boot { position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #faf9f6; color: #1b1a18; font-family: 'IBM Plex Mono', monospace; transition: opacity 450ms ease; }
      .boot--done { opacity: 0; pointer-events: none; }
      .boot__mark { width: 96px; height: 96px; animation: boot-float 2.4s ease-in-out infinite; }
      .boot__title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: -0.01em; }
      .boot__bar { width: 220px; height: 12px; border: 2px solid #1b1a18; box-shadow: 3px 3px 0 #1b1a18; background: #fff; overflow: hidden; }
      .boot__fill { height: 100%; width: 0; background: #1b1a18; animation: boot-fill 1.6s cubic-bezier(.2,.7,.3,1) forwards; }
      .boot--done .boot__fill { width: 100%; animation: none; transition: width 200ms; }
      .boot__line { font-size: 12px; color: #6b6863; }
      @keyframes boot-float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
      @keyframes boot-fill { to { width: 85%; } }
      @media (prefers-reduced-motion: reduce) { .boot__mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-label="Chargement">
      <svg class="boot__mark" viewBox="0 0 64 62" aria-hidden="true">
        <g stroke="#1b1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    {/* oreilles */}
    <circle cx="17.5" cy="15.5" r="4.6" fill="#8f8a83"/>
    <circle cx="46.5" cy="15.5" r="4.6" fill="#8f8a83"/>
    {/* épaules, dans l'eau */}
    <path d="M12 56 C11 46 19 40 32 40 C45 40 53 46 52 56 Z" fill="#99948c"/>
    {/* tête ronde */}
    <circle cx="32" cy="27" r="17" fill="#fdfaf3"/>
    {/* duvet du front */}
    <path d="M27 11.5 q1.5 2 3 0 M32.5 10.8 q1.5 2 3 0" fill="none" stroke-width="1.3"/>
    {/* yeux */}
    <circle cx="24.5" cy="25" r="3.3" fill="#1b1a18" stroke="none"/>
    <circle cx="39.5" cy="25" r="3.3" fill="#1b1a18" stroke="none"/>
    <circle cx="25.6" cy="23.8" r="1.1" fill="#fff" stroke="none"/>
    <circle cx="40.6" cy="23.8" r="1.1" fill="#fff" stroke="none"/>
    {/* coussinets de moustaches */}
    <circle cx="28.3" cy="35" r="4.6" fill="#fff" stroke-width="1.6"/>
    <circle cx="35.7" cy="35" r="4.6" fill="#fff" stroke-width="1.6"/>
    <g fill="#1b1a18" stroke="none">
      <circle cx="26" cy="34.2" r="0.6"/><circle cx="27.6" cy="36.6" r="0.6"/><circle cx="25.3" cy="36.9" r="0.6"/>
      <circle cx="38" cy="34.2" r="0.6"/><circle cx="36.4" cy="36.6" r="0.6"/><circle cx="38.7" cy="36.9" r="0.6"/>
    </g>
    {/* truffe */}
    <path d="M27.6 30.2 C27.6 28 36.4 28 36.4 30.2 C36.4 32.6 33.6 33.8 32 33.8 C30.4 33.8 27.6 32.6 27.6 30.2 Z" fill="#1b1a18" stroke-width="1.2"/>
    <ellipse cx="30.4" cy="29.8" rx="1.3" ry="0.7" fill="#fff" stroke="none"/>
    {/* bouche */}
    <path d="M29.6 40 q1.2 1.3 2.4 0 q1.2 1.3 2.4 0" fill="none" stroke-width="1.3"/>
    {/* moustaches */}
    <path d="M22 34 l-8 -1.5 M22 36.5 l-8 1 M42 34 l8 -1.5 M42 36.5 l8 1" fill="none" stroke-width="1"/>
    {/* pattes qui tiennent le galet bleu */}
    <ellipse cx="32" cy="48.5" rx="6.6" ry="3.9" fill="#4a8fd4"/>
    <ellipse cx="24.5" cy="48" rx="3.4" ry="2.8" fill="#75716a"/>
    <ellipse cx="39.5" cy="48" rx="3.4" ry="2.8" fill="#75716a"/>
    {/* l'eau, devant */}
    <path d="M3 55 C9 51.5 14 53.5 19 52 C24 50.5 28 53.5 32 52.5 C37 51.2 41 53.6 46 52 C51 50.5 56 53 61 55 L61 64 L3 64 Z" fill="#dfdbd4" stroke="none"/>
    <path d="M3 55 C9 51.5 14 53.5 19 52 C24 50.5 28 53.5 32 52.5 C37 51.2 41 53.6 46 52 C51 50.5 56 53 61 55" fill="none"/>
    <path d="M10 57 l6 0 M42 57.5 l7 0" fill="none" stroke="#fff" stroke-width="1.6"/>
  </g>
      </svg>
      <div class="boot__title">PET THE OTTER.</div>
      <div class="boot__bar"><div class="boot__fill"></div></div>
      <div class="boot__line">on remplit la flaque…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
